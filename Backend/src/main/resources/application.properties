spring.application.name=demo

server.port=9090

server.servlet.session.cookie.same-site=None
server.servlet.session.cookie.secure=true

spring.datasource.hikari.keepalive-time=15000
spring.datasource.hikari.idle-timeout=30000

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/bluemoon_db?sslmode=require}

spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}

spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:1}

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect

spring.jpa.hibernate.ddl-auto=update

spring.thymeleaf.cache=false

server.servlet.session.timeout=300s

spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=<email>
# Với gmail thì phải sử dụng app password thay vì password
spring.mail.password=<password>  
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# JWT Configuration
app.jwt.secret=${APP_JWT_SECRET:89XwhTIZQTUxRtrWNOd2mcFdhqMIXlCwaL12lW36jnw=}
app.jwt.expiration=${APP_JWT_EXPIRATION:3600000000}

# Default admin account (được tạo lúc khởi động bởi AdminUserInitializer)
app.admin.username=${ADMIN_USERNAME:admin}
app.admin.password=${ADMIN_PASSWORD:1234567890}
app.admin.email=${ADMIN_EMAIL:admin@gmail.com}
app.admin.phone=${ADMIN_PHONE:0123456789}

